services:
  postgres:
    image: postgres:16-alpine
    container_name: coffer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffer
      POSTGRES_PASSWORD: coffer
      POSTGRES_DB: coffer
    ports:
      - '5432:5432'
    volumes:
      - coffer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffer -d coffer']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  coffer-postgres-data:
